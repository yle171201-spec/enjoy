# Smoke-test Blueprint: free web + free Postgres only.
# The app can pull public data without any token. Full-market multi-year history is
# intentionally NOT auto-bootstrapped on the free 1 GB / 30-day test database.
databases:
  - name: abc-a-share-db-v2-test
    databaseName: abc_strategy
    user: abc_strategy
    region: singapore
    plan: free

services:
  - type: web
    name: abc-a-share-web-v2-test
    runtime: docker
    region: singapore
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abc-a-share-db-v2-test
          property: connectionString
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: DATA_PROVIDER
        value: public
      - key: BOOTSTRAP_START_DATE
        value: "2025-01-01"
      - key: BOOTSTRAP_BATCH_SIZE
        value: "100"
      - key: LIVE_SCAN_CALENDAR_DAYS
        value: "720"
