<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <title>{% block title %}A股ABC{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="/static/app.js"></script>
</head>
<body>
<header>
  <a class="brand" href="/">ABC 日线交易系统 <small>V2</small></a>
  <nav>
    <a href="/">今日操作</a>
    <a href="/screener">历史信号</a>
    <a href="/portfolio">账户回测</a>
    <a href="/review">策略复盘</a>
    <a href="/data">数据中心</a>
    <a href="/validation">策略校验</a>
    <a href="/backtest">执行回测</a>
    <a href="/logout">退出</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  生产数据固定从 2025-01-01 开始。实盘只按正式日线信号：收盘确认、下一交易日开盘执行；仓位按结构风险预算机械计算，不人为设置固定止盈。研究、回测、复盘和数据维护全部保留，但与日常操作分层展示。
</footer>
</body>
</html>
