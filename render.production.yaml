databases:
  - name: abc-a-share-db-v2
    databaseName: abc_strategy
    user: abc_strategy
    region: singapore
    plan: basic-256mb
    diskSizeGB: 5

services:
  - type: web
    name: abc-a-share-web-v2
    runtime: docker
    region: singapore
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abc-a-share-db-v2
          property: connectionString
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: DATA_PROVIDER
        value: public
      - key: BOOTSTRAP_START_DATE
        value: "2021-01-01"
      - key: BOOTSTRAP_BATCH_SIZE
        value: "200"
      - key: LIVE_SCAN_CALENDAR_DAYS
        value: "720"

  - type: cron
    name: abc-a-share-daily-update-v2
    runtime: docker
    region: singapore
    plan: standard
    schedule: "30 10 * * 1-5"
    dockerCommand: "python scripts/run_daily.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abc-a-share-db-v2
          property: connectionString
      - key: DATA_PROVIDER
        value: public
      - key: BOOTSTRAP_START_DATE
        value: "2021-01-01"
      - key: LIVE_SCAN_CALENDAR_DAYS
        value: "720"
